# RomSync — example deployment.
#   docker compose up -d
# then open http://<server>:8080 to create the administrator account.
# Update with: docker compose pull && docker compose up -d
services:
  romsync:
    # Published image (linux/amd64, linux/arm64). Pin a minor version (0.3)
    # to only receive fixes, or an exact one (0.3.0).
    image: ghcr.io/dadoux01/romsync:latest
    # To build the image from a clone of the repository instead, replace
    # "image" above with:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: romsync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - romsync-data:/data
    environment:
      ROMSYNC_PORT: "8080"
      ROMSYNC_DATA_DIR: /data
      # Maximum size of an uploaded save, in bytes (16 MiB).
      ROMSYNC_MAX_UPLOAD: "16777216"
      # Proxies whose X-Forwarded-For header is trusted (comma-separated IPs
      # or CIDR networks). Empty: the TCP peer address is used. See the README
      # section about Tailscale.
      ROMSYNC_TRUSTED_PROXIES: ""
      ROMSYNC_RETENTION_INTERVAL: 1h

volumes:
  # Holds the SQLite database (romsync.db) and the save files (blobs/).
  # It belongs to the container user (65532:65532). Back it up by copying
  # it, after `sqlite3 romsync.db "VACUUM INTO 'backup.db'"`.
  romsync-data:
