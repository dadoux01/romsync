name: romsync_core
description: Platform-independent logic of the RomSync client (API client, NDS headers, conversion profiles, local state, upload queue, sync engine, emulators). Pure Dart, testable without Flutter.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.8
  http: ^1.6.0
  meta: ^1.19.0
  path: ^1.9.1
  toml: ^0.18.0
  uuid: ^4.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
