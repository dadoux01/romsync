# Publishes a release when a v* tag is pushed (e.g. v0.3.0):
# - a GitHub Release with the clients (Linux x64/arm64 tar.gz, macOS zip,
#   Windows zip), the 3DS homebrew (.3dsx and .cia), SHA256SUMS and its
#   Ed25519 signature SHA256SUMS.sig (see docs/releasing.md);
# - the server image on ghcr.io (linux/amd64 and linux/arm64), tagged with
#   the exact version (0.3.0), the minor version (0.3) and latest.
#
# The signing key is only available to the "sign" job, through the
# "release" environment, which only accepts v* tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A strict format: the version ends up in file names and scripts.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  client:
    name: Clients
    needs: version
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ needs.version.outputs.version }}

  homebrew-3ds:
    name: 3DS homebrew
    needs: version
    uses: ./.github/workflows/build-3ds.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    name: Server image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/romsync
          # 0.3.0, 0.3 and, for final releases only, latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Signs SHA256SUMS. Only GitHub's own actions and openssl run here: this
  # is the only job that sees RELEASE_SIGNING_KEY.
  sign:
    name: Sign
    needs: [client, homebrew-3ds]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            keys
            .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: romsync-*
          path: dist
          merge-multiple: true
      - name: Sign and verify
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          .github/scripts/sign.sh dist "$key" keys/release-ed25519.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, client, homebrew-3ds, image, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: romsync-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # The update order first, then GitHub's generated notes.
          {
            echo '## Updating'
            echo
            echo 'Update the **server first** (pull the new image, e.g. with Dockge), then the clients'
            echo '(PC app, 3DS homebrew). A client newer than its server says so instead of relying on'
            echo 'features the server does not have yet.'
            echo
            echo '`SHA256SUMS` is signed with the release key (`SHA256SUMS.sig`, Ed25519, see'
            echo '`docs/releasing.md`).'
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSync $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
