# Publishes a release when a v* tag is pushed (e.g. v0.3.0):
# - a GitHub Release with the clients (Linux x64/arm64 tar.gz, macOS zip,
#   Windows zip) and the 3DS homebrew (.3dsx and .cia);
# - the server image on ghcr.io (linux/amd64 and linux/arm64), tagged with
#   the exact version (0.3.0), the minor version (0.3) and latest.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  client:
    name: Clients
    needs: version
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ needs.version.outputs.version }}

  3ds:
    name: 3DS homebrew
    needs: version
    uses: ./.github/workflows/build-3ds.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    name: Server image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/romsync
          # 0.3.0, 0.3 and, for final releases only, latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [version, client, 3ds, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: romsync-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSync ${{ needs.version.outputs.version }}" \
            --generate-notes \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
