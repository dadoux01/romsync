name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lists what changed since the previous push (or the base of a pull
  # request), so that each part only runs when its files change. A change
  # under .github/, or a history that cannot be compared, runs everything.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      web: ${{ steps.f.outputs.web }}
      client: ${{ steps.f.outputs.client }}
      client_build: ${{ steps.f.outputs.client_build }}
      core_3ds: ${{ steps.f.outputs.core_3ds }}
      build_3ds: ${{ steps.f.outputs.build_3ds }}
      openapi: ${{ steps.f.outputs.openapi }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=false
          files=
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all=true
          else
            files=$(git diff --name-only "$BASE"...HEAD)
            if grep -q '^\.github/' <<<"$files"; then all=true; fi
          fi
          printf 'Changed files:\n%s\n' "$files"
          out() {
            if $all || grep -qE "$2" <<<"$files"; then v=true; else v=false; fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          out server '^(server|api)/'
          out web '^web/'
          # The client's and the 3DS core's end-to-end tests run the server.
          out client '^(client|profiles|server)/'
          out client_build '^(client|profiles)/'
          out core_3ds '^(3ds|profiles|server)/'
          out build_3ds '^(3ds|profiles)/'
          out openapi '^api/'
          out docker '^(server|web|deploy)/'

  server:
    name: Server (lint, tests)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/romsync

  web:
    name: Web interface (check, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  client:
    name: Client tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: 7-Zip
        run: |
          case "${{ runner.os }}" in
            # GTK 3, X11 and Xi headers: nativeapi (tray) builds its native
            # code even for flutter test.
            Linux) sudo apt-get update && sudo apt-get install -y p7zip-full libgtk-3-dev libx11-dev libxi-dev ;;
            macOS) brew install sevenzip ;;
            Windows) 7z i > /dev/null ;;  # preinstalled
          esac
      - name: Dependencies
        working-directory: client
        run: flutter pub get
      - name: flutter analyze
        if: runner.os == 'Linux'
        working-directory: client
        run: flutter analyze
      - name: Profiles bundled in the app are up to date
        if: runner.os == 'Linux'
        run: client/tool/sync_profiles.sh && git diff --exit-code client/app/assets/profiles
      - name: romsync_core tests
        working-directory: client/packages/romsync_core
        run: dart test -x e2e
      - name: End-to-end tests against the real server
        working-directory: client/packages/romsync_core
        run: dart test -t e2e
      - name: App tests
        working-directory: client/app
        run: flutter test

  # Jobs below wait for others that may be skipped: run when nothing they
  # need failed or was cancelled.
  client-build:
    name: Client builds
    needs: [changes, client]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.client_build == 'true' }}
    uses: ./.github/workflows/build-client.yml
    with:
      version: ci

  core-3ds:
    name: 3DS core (unit and end-to-end tests)
    needs: changes
    if: needs.changes.outputs.core_3ds == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      # With AddressSanitizer and UBSan (available on the runner).
      - name: Unit tests
        run: make 3ds-test
      - name: End-to-end tests against the real server
        run: make 3ds-e2e

  build-3ds:
    name: 3DS builds
    needs: [changes, core-3ds]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.build_3ds == 'true' }}
    uses: ./.github/workflows/build-3ds.yml
    with:
      version: ci

  openapi:
    name: OpenAPI lint
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@1 lint api/openapi.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [changes, server, web]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: romsync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name romsync -p 8080:8080 romsync:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/v1/setup | grep -q '"needed":true'
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker exec romsync /usr/local/bin/romsync healthcheck
          docker rm -f romsync
