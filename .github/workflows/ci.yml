name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/romsync

  web:
    name: Web interface (check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  client:
    name: Client (analyze, tests, end-to-end)
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: flutter --version
      - name: Dependencies
        working-directory: client
        run: flutter pub get
      - name: flutter analyze
        working-directory: client
        run: flutter analyze
      - name: romsync_core tests
        working-directory: client/packages/romsync_core
        run: dart test -x e2e
      - name: End-to-end tests against the real server
        working-directory: client/packages/romsync_core
        run: dart test -t e2e
      - name: App tests
        working-directory: client/app
        run: flutter test

  client-build:
    name: Client Linux build (${{ matrix.arch }})
    needs: client
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      FLUTTER_VERSION: 3.47.9
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build
        working-directory: client/app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: romsync-linux-${{ matrix.arch }}
          path: client/app/build/linux/${{ matrix.arch }}/release/bundle

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@1 lint api/openapi.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: romsync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name romsync -p 8080:8080 romsync:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/v1/setup | grep -q '"needed":true'
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker exec romsync /usr/local/bin/romsync healthcheck
          docker rm -f romsync
